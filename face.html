<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>かおであそぶ — 60秒の実験装置</title>
<meta name="description" content="落ちてくる顔と同じ表情を作ると弾ける。60秒。カメラの映像は端末の外に出ません。">
<meta name="robots" content="noindex">
<!-- MediaPipe の置き場所(任意)。空なら jsDelivr の CDN から読む。
     合計およそ 15.6MB(モデル 3.6MB + wasm 12MB)が、**カメラの許可が下りた後にだけ**降る。
     ゆびの経路には 1バイトも降らない。
     自分のドメインから brotli で配りたい時や、CDN が塞がれている回線向けにここを埋める。
     置くもの: <base>/vision_bundle.mjs と <base>/wasm/ 一式
       npm pack @mediapipe/tasks-vision@1.0.1 して package/ の中身をそのまま置けばよい。
     例) <meta name="mediapipe-base" content="/vendor/tasks-vision">
         <meta name="face-model"     content="/vendor/face_landmarker.task"> -->
<meta name="mediapipe-base" content="">
<meta name="face-model" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😮</text></svg>">
<style>
  /* 1画面の色は4〜6色。彩度の高い色は「操作できるもの」に1つだけ。 */
  :root {
    --bg:    #0b0a14;
    --panel: #17162a;
    --line:  #2e2c4d;
    --ink:   #eceaff;
    --dim:   #8d89b8;
    --hot:   #ffd23f;   /* 唯一の高彩度。的と、いま反応しているものだけに使う */
    --ok:    #4ee39a;
    --bad:   #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
  }
  body { display: flex; flex-direction: column; }

  .screen { display: none; flex: 1; min-height: 0; }
  .screen.on { display: flex; }

  /* ---- 入口 ---- */
  #intro { flex-direction: column; align-items: center; justify-content: center;
           padding: 24px max(24px, env(safe-area-inset-left)) 24px; gap: 18px; text-align: center; }
  #intro h1 { font-size: clamp(28px, 8vw, 44px); margin: 0; letter-spacing: .02em; }
  #intro .faces { font-size: clamp(38px, 13vw, 68px); letter-spacing: .06em; }
  #intro p { margin: 0; max-width: 30em; line-height: 1.75; color: var(--dim); font-size: 15px; }
  .privacy {
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px;
    background: var(--panel); max-width: 30em; text-align: left; font-size: 13.5px; line-height: 1.8;
  }
  .privacy b { color: var(--ink); }
  .choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 4px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 22px; min-height: 48px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
  button.primary { background: var(--hot); color: #1a1400; border-color: var(--hot); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 12.5px; color: var(--dim); }
  .warn { color: var(--bad); }

  /* ---- 遊ぶ画面 ---- */
  #play { flex-direction: column; }
  #stageWrap { position: relative; flex: 1; min-height: 0; }
  #stage { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex;
    align-items: center; gap: 12px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #clock { font-size: 26px; font-weight: 700; }
  #score { margin-left: auto; font-size: 18px; color: var(--dim); }
  #phaseTag { font-size: 13px; color: var(--dim); }

  /* 自分の顔。小さく、隅に、半透明で。主役はゲーム。 */
  #mirror {
    position: absolute; right: 10px; bottom: 10px; width: 132px; height: 99px;
    border-radius: 12px; overflow: hidden; border: 2px solid var(--line);
    background: #000; opacity: .92; pointer-events: none;
  }
  #mirror.lost { border-color: var(--bad); }
  #cam, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 左右反転は必須。反転していないと自分の動きと画面が逆になり、位置合わせが不可能。 */
  #cam { object-fit: cover; transform: scaleX(-1); }
  #camDot {
    position: absolute; left: 6px; top: 6px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--bad); box-shadow: 0 0 8px var(--bad);
  }

  /* 入力が届いていることを見せる。しきい値の手前でも「もう少しで届く」が見える。 */
  #meters {
    display: flex; gap: 8px; padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .meter { flex: 1; min-width: 0; }
  .meter .cap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .meter .cap .em { font-size: 19px; }
  .meter .bar { height: 9px; border-radius: 5px; background: var(--panel); overflow: hidden; margin-top: 4px;
                position: relative; border: 1px solid var(--line); }
  .meter .fill { height: 100%; width: 0%; background: var(--dim); transition: none; }
  .meter.on .fill { background: var(--hot); }
  .meter.on .cap { color: var(--hot); }
  /* しきい値の位置。2本あることは説明しないが、見えていれば身体が勝手に覚える。 */
  .meter .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }

  /* タップ経路のボタン。44pt を下回らない。 */
  #tapPad { display: none; gap: 10px; padding: 0 12px 12px; }
  #tapPad.on { display: flex; }
  #tapPad button { flex: 1; min-height: 68px; font-size: 30px; padding: 8px; }
  #tapPad button.held { background: var(--hot); border-color: var(--hot); }

  /* 顔を見失った時。文章ではなく画面の縁の色で返す。 */
  #edge {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 0 6px var(--bad); transition: opacity .18s;
  }
  #edge.on { opacity: .85; }

  /* ---- 結果 ---- */
  #result { flex-direction: column; padding: 20px 16px 28px; gap: 14px; overflow-y: auto; }
  #result h2 { margin: 0; font-size: 22px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; }
  .card .k { font-size: 12px; color: var(--dim); }
  .card .v { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 3px; }
  .card .u { font-size: 13px; color: var(--dim); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; }
  .verdict { border-radius: 14px; padding: 14px 16px; line-height: 1.8; font-size: 14px;
             border: 1px solid var(--line); background: var(--panel); }
  .verdict.good { border-color: var(--ok); }
  .verdict.warn { border-color: var(--hot); }
  h3 { font-size: 14px; color: var(--dim); margin: 8px 0 0; font-weight: 600; }
  .muted { color: var(--dim); font-size: 12.5px; line-height: 1.7; }

  #loading { flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .spin { font-size: 46px; animation: b 1.1s ease-in-out infinite; }
  @keyframes b { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>

<!-- 入口。**カメラの許可を求める前に、何に使うかを見せる。** -->
<section id="intro" class="screen on">
  <div class="faces">😮 😊 😲</div>
  <h1>かおで あそぶ</h1>
  <p>おちてくる かおと おなじ かおを つくると、はじけます。<br>60びょうで おわり。</p>

  <div class="privacy">
    <b>カメラのことだけ、さきに。</b><br>
    ・顔を読む計算は、<b>この端末の中だけ</b>で終わります<br>
    ・映像も、顔から作った数値も、<b>どこにも送りません。保存もしません</b><br>
    ・遊び終わったらカメラは止まります<br>
    ・カメラを使わずに、<b>指だけでも同じものが遊べます</b>
  </div>

  <div class="choices">
    <button id="goFace" class="primary">カメラで あそぶ</button>
    <button id="goTap">ゆびで あそぶ</button>
  </div>
  <div class="note" id="introNote">顔の体操になって、ついでに変な顔で笑えます。</div>
</section>

<section id="loading" class="screen">
  <div class="spin">😮</div>
  <div id="loadMsg">じゅんびちゅう…</div>
  <div class="note" id="loadNote">はじめの1回だけ、15MBほど読み込みます</div>
  <button id="loadCancel">やめる</button>
</section>

<section id="play" class="screen">
  <!-- 鏡と HUD は「盤面の中」に置く。#play の底に貼ると、メーターやタップの
       ボタンに被さる(実際に3つ目のメーターが隠れた)。 -->
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="hud">
      <span id="clock">60</span>
      <span id="phaseTag"></span>
      <span id="score">0</span>
    </div>
    <div id="edge"></div>
    <div id="mirror" hidden>
      <video id="cam" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="camDot" title="カメラ動作中"></div>
    </div>
  </div>
  <div id="meters"></div>
  <div id="tapPad"></div>
</section>

<section id="result" class="screen">
  <h2>60びょう、おつかれさま</h2>
  <div class="cards" id="cards"></div>
  <div class="verdict" id="verdict"></div>
  <h3>表情ごと</h3>
  <table id="perKey"></table>
  <h3>つぎ</h3>
  <div class="choices" style="justify-content:flex-start">
    <button id="again" class="primary">もういちど</button>
    <button id="other"></button>
    <button id="reset">記録を消す</button>
  </div>
  <div class="muted" id="footnote"></div>
</section>

<script type="module" src="src/face/main.js"></script>
</body>
</html>
