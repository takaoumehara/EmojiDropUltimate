<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05050f;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
#scanlines{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.06) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.gbtn{position:fixed;top:calc(8px + env(safe-area-inset-top));z-index:10;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.7);color:#fff;font-size:18px;width:44px;height:40px;cursor:pointer;border-radius:10px;display:none;align-items:center;justify-content:center;line-height:1;-webkit-tap-highlight-color:transparent}
.gbtn:active{background:rgba(255,255,255,0.25)}
#pauseBtn{right:calc(10px + env(safe-area-inset-right))}
#muteBtn{right:calc(60px + env(safe-area-inset-right))}
#homeBtn{right:calc(110px + env(safe-area-inset-right))}
#langBtn{left:calc(10px + env(safe-area-inset-left))}
#skinBtn{left:calc(60px + env(safe-area-inset-left))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scanlines"></div>
<button id="homeBtn" class="gbtn" aria-label="title">⌂</button>
<button id="muteBtn" class="gbtn" aria-label="mute">🔊</button>
<button id="pauseBtn" class="gbtn" aria-label="pause">❚❚</button>
<button id="langBtn" class="gbtn" aria-label="language">🌐</button>
<button id="skinBtn" class="gbtn" aria-label="skin">🎨</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
