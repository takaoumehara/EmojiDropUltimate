// === ボス攻撃フェーズ ===
const BOSS_PHASES = [
  { attacks: [
    { type: 'aimed',  interval: 850,  speed: 240, count: 1 },
    { type: 'spread', interval: 1500, speed: 190, count: 5, arc: 0.5 },
  ]},
  { attacks: [
    { type: 'spread', interval: 1000, speed: 210, count: 7, arc: 0.6 },
    { type: 'aimed',  interval: 620,  speed: 270, count: 2 },
    { type: 'summon', interval: 4200, minion: 0 },
  ]},
  { attacks: [
    { type: 'spread', interval: 750,  speed: 240, count: 9, arc: 0.75 },
    { type: 'aimed',  interval: 430,  speed: 300, count: 3 },
    { type: 'summon', interval: 3400, minion: 1 },
    { type: 'charge', interval: 5200 },
  ]},
];

// === ベル (Twinbee style) — 撃つと色が変わる ===
const BELLS = [
  { color: '#ffffff', name: 'SCORE',  ja: 'スコア',   effect: 'points', value: 500 },
  { color: '#4a9eff', name: 'SPEED',  ja: 'スピード', effect: 'speed', duration: 9000 },
  { color: '#ff5252', name: 'POWER',  ja: 'パワー',   effect: 'power' },
  { color: '#b967ff', name: 'OPTION', ja: 'オプション', effect: 'option' },
  { color: '#ffd700', name: 'SHIELD', ja: 'シールド', effect: 'shield' },
  { color: '#7CFC00', name: 'BOMB',   ja: 'ボム',     effect: 'bomb' },
];

// === キャンバス ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn = document.getElementById('muteBtn');
let W = 0, H = 0, DPR = 1, UI = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  UI = Math.max(0.8, Math.min(W / 420, H / 740, 1.35));
}
resize();
window.addEventListener('resize', resize);

// === ユーティリティ ===
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

// 現在のステージ設定
function stage() { return STAGES[game.stageIndex]; }
function dirDef() { return DIRS[stage().dir]; }
// 前方(撃つ方向)の角度
function fwAngle() { const d = dirDef(); return Math.atan2(d.fy, d.fx); }
// 敵が迫ってくる角度(前方の逆)
function inAngle() { const d = dirDef(); return Math.atan2(-d.fy, -d.fx); }
function isVert() { const d = stage().dir; return d === 'up' || d === 'down'; }
// 横軸(進行方向と垂直)の幅 / 縦軸(進行方向)の奥行き
function latSpan() { return isVert() ? W : H; }
function fwSpan() { return isVert() ? H : W; }

// prog: 前方エッジからの侵入距離 / lat: 垂直方向の座標(px)
function posFromPL(prog, lat) {
  switch (stage().dir) {
    case 'up':    return { x: lat, y: -50 + prog };
    case 'down':  return { x: lat, y: H + 50 - prog };
    case 'right': return { x: W + 50 - prog, y: lat };
    case 'left':  return { x: -50 + prog, y: lat };
  }
}
// プレイヤー(等)の横位置(lat座標)
function latOf(p) { return isVert() ? p.x : p.y; }
// プレイヤーの初期位置(後方エッジ寄り)
function playerHome() {
  switch (stage().dir) {
    case 'up':    return { x: W / 2, y: H - 120 };
    case 'down':  return { x: W / 2, y: 120 };
    case 'right': return { x: 120, y: H / 2 };
    case 'left':  return { x: W - 120, y: H / 2 };
  }
}

// === ウェーブ編隊パターン (lat座標 + 出現ディレイで表現) ===
const PATTERNS = [
  // 横一列
  (types) => {
    const t = types[randInt(0, 1)];
    const n = randInt(4, 6), span = latSpan();
    return Array.from({ length: n }, (_, i) => ({
      t, lat: span * (i + 1) / (n + 1), delay: i * 140,
    }));
  },
  // V字編隊
  (types) => {
    const t = types[randInt(0, 2)];
    const mid = latSpan() / 2;
    return Array.from({ length: 5 }, (_, i) => ({
      t, lat: mid + (i - 2) * 52, delay: Math.abs(i - 2) * 220,
    }));
  },
  // 2列縦隊
  (types) => {
    const t = types[randInt(1, types.length - 1)];
    const span = latSpan();
    return [0, 1, 2, 3].map(i => ({
      t, lat: span * (i % 2 ? 0.7 : 0.3), delay: i * 240,
    }));
  },
  // 斜めライン
  (types) => {
    const t = types[randInt(0, 1)];
    const span = latSpan();
    return Array.from({ length: 4 }, (_, i) => ({
      t, lat: span * (0.2 + i * 0.2), delay: i * 190,
    }));
  },
  // 精鋭1体 (HP強化)
  (types) => {
    const t = types[types.length - 1];
    return [{ t: { ...t, hp: t.hp + 2, pts: t.pts * 2 }, lat: latSpan() / 2, delay: 0 }];
  },
  // 両サイドから挟み撃ち
  (types) => {
    const t = types[randInt(0, 2)];
    const span = latSpan();
    return [0, 1, 2, 3, 4, 5].map(i => ({
      t, lat: span * (i % 2 ? 0.12 : 0.88), delay: Math.floor(i / 2) * 300,
    }));
  },
];

// ============================================================
// サウンドエンジン (WebAudio 自前実装・依存なし)
// ============================================================
const Snd = {
  ctx: null, master: null, muted: localStorage.getItem('edu_mute') === '1',
  bgmTimer: null, bgmStep: 0, bgmMode: 'stage', lastShoot: 0,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.8;
      this.master.connect(this.ctx.destination);
    } catch (e) { /* 音なしでも動作 */ }
  },

  tone(freq, type, dur, vol, when = 0, slideTo = null) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + when;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },

  noise(dur, vol, when = 0, low = false) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + when;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = src;
    if (low) {
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 500;
      src.connect(f); node = f;
    }
    node.connect(g); g.connect(this.master);
    src.start(t0);
  },

  shoot() {
    const now = performance.now();
    if (now - this.lastShoot < 85) return;
    this.lastShoot = now;
    this.tone(880, 'square', 0.05, 0.05, 0, 500);
  },
  hit()      { this.tone(300, 'square', 0.05, 0.07); },
  kill()     { this.noise(0.12, 0.12); this.tone(660, 'triangle', 0.1, 0.09, 0.02, 120); },
  bell()     { this.tone(1320, 'triangle', 0.07, 0.1); },
  power()    { [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 'triangle', 0.1, 0.1, i * 0.08)); },
  death()    { this.tone(440, 'sawtooth', 0.55, 0.14, 0, 50); this.noise(0.45, 0.14, 0.1, true); },
  bossHit()  { this.tone(130, 'square', 0.07, 0.09); },
  bomb()     { this.noise(0.6, 0.22, 0, true); this.tone(60, 'sine', 0.6, 0.25, 0, 30); },
  zap()      { this.noise(0.25, 0.15); this.tone(2000, 'sawtooth', 0.2, 0.08, 0, 100); },
  warning()  { for (let i = 0; i < 6; i++) this.tone(i % 2 ? 660 : 880, 'square', 0.14, 0.08, i * 0.22); },
  clear()    { [72, 76, 79, 84].forEach((m, i) => this.tone(midiFreq(m), 'triangle', 0.22, 0.11, i * 0.15)); },
  victory()  { [72, 74, 76, 79, 81, 79, 76, 84].forEach((m, i) => this.tone(midiFreq(m), 'triangle', 0.25, 0.11, i * 0.19)); },
  continueJingle() { [60, 64, 67, 72, 76, 79].forEach((m, i) => this.tone(midiFreq(m), 'triangle', 0.12, 0.1, i * 0.1)); },

  // --- BGM: ステージ毎のスケール/BPMで自動生成 ---
  startBGM(mode) {
    this.stopBGM();
    if (!this.ctx) return;
    this.bgmMode = mode;
    this.bgmStep = 0;
    const loop = () => {
      const st = stage();
      const boss = this.bgmMode === 'boss';
      const bpm = st.bpm + (boss ? 32 : 0);
      const stepDur = 60 / bpm / 2; // 8分音符
      const s = this.bgmStep;
      const scale = st.scale;
      if (!this.muted) {
        // メロディ: 疑似ランダムウォーク
        const mi = Math.abs(Math.floor(Math.sin(s * 12.9898 + game.stageIndex * 78.233) * 43758.5453) % scale.length);
        let note = scale[mi] + (s % 16 >= 8 ? 12 : 0);
        if (boss) note = scale[mi] - (s % 4 === 3 ? 1 : 0);
        if (s % 2 === 0 || boss) this.tone(midiFreq(note), 'square', stepDur * 0.85, 0.028);
        // ベース
        if (s % 4 === 0) this.tone(midiFreq(scale[0] - 24 + (boss && s % 16 >= 8 ? 3 : 0)), 'triangle', stepDur * 3, 0.06);
        // ハット
        if (s % 2 === 1) this.noise(0.02, 0.015);
        if (boss && s % 8 === 4) this.noise(0.08, 0.05, 0, true);
      }
      this.bgmStep++;
      this.bgmTimer = setTimeout(loop, stepDur * 1000);
    };
    loop();
  },
  stopBGM() { if (this.bgmTimer) { clearTimeout(this.bgmTimer); this.bgmTimer = null; } },
  toggleMute() {
    this.muted = !this.muted;
    localStorage.setItem('edu_mute', this.muted ? '1' : '0');
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.8;
    muteBtn.textContent = this.muted ? '🔇' : '🔊';
  },
};
muteBtn.textContent = Snd.muted ? '🔇' : '🔊';

// ============================================================
// AI 1: リアル天気連動ワールドエンジン (Open-Meteo API・キー不要)
// 現実の天気がゲーム世界のルールを書き換える
// ============================================================
const Weather = {
  loaded: false, failed: false, place: '',
  temp: null, wind: 0, code: 0, isDay: 1, kind: 'clear',
  mods: { enemySpeed: 1, spawnMul: 1, scoreMul: 1, windLat: 0, lightning: false, fog: false, rain: false, snow: false, night: false },
  effects: [], // タイトル画面に表示する適用効果リスト

  async load() {
    let lat = 35.68, lon = 139.76, place = '東京(デフォルト)';
    try {
      const pos = await new Promise((res, rej) => {
        if (!navigator.geolocation) return rej();
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 3500, maximumAge: 600000 });
      });
      lat = pos.coords.latitude; lon = pos.coords.longitude;
      place = `N${lat.toFixed(1)} E${lon.toFixed(1)}`;
    } catch (e) { /* 位置情報なし → 東京 */ }
    this.place = place;
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`, { signal: ctrl.signal });
      const j = await r.json();
      const cw = j.current_weather;
      this.temp = cw.temperature;
      this.wind = cw.windspeed;
      this.code = cw.weathercode;
      this.isDay = cw.is_day;
      this.loaded = true;
    } catch (e) {
      this.failed = true;
      return;
    }
    this.applyMods();
  },

  applyMods() {
    const c = this.code, m = this.mods, fx = this.effects;
    if (c >= 95) { this.kind = 'thunder'; m.lightning = true; m.rain = true; fx.push('⛈️ 雷雨 → 落雷が敵を焼く!'); }
    else if (c >= 71 && c <= 86 && !(c >= 80 && c <= 82)) { this.kind = 'snow'; m.snow = true; m.enemySpeed *= 0.9; fx.push('❄️ 雪 → 敵が凍えて減速'); }
    else if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) { this.kind = 'rain'; m.rain = true; m.spawnMul *= 1.1; fx.push('🌧️ 雨 → 敵が活性化・雨エフェクト'); }
    else if (c === 45 || c === 48) { this.kind = 'fog'; m.fog = true; m.scoreMul *= 1.25; fx.push('🌫️ 霧 → 視界不良・スコア+25%'); }
    else if (c >= 1 && c <= 3) { this.kind = 'clouds'; fx.push('⛅ くもり → 平常運転'); }
    else { this.kind = 'clear'; fx.push('☀️ 快晴 → ベル出現アップ'); }
    if (this.wind >= 15) { m.windLat = clamp((this.wind - 10) * 4, 0, 130); fx.push(`💨 強風${Math.round(this.wind)}km/h → 弾が流される`); }
    if (this.temp !== null && this.temp >= 32) { m.enemySpeed *= 1.12; fx.push('🥵 猛暑 → 敵がヒートアップ'); }
    if (this.temp !== null && this.temp <= 0) { m.enemySpeed *= 0.88; fx.push('🥶 氷点下 → 敵がスローダウン'); }
    if (!this.isDay) { m.night = true; m.scoreMul *= 1.2; fx.push('🌙 夜 → ナイトモード・スコア+20%'); }
  },

  statusLine() {
    if (this.failed) return '📡 天気オフライン → 標準モード';
    if (!this.loaded) return '📡 天気データ受信中…';
    const icons = { clear: '☀️', clouds: '⛅', fog: '🌫️', rain: '🌧️', snow: '❄️', thunder: '⛈️' };
    return `${icons[this.kind]} ${this.place} ${Math.round(this.temp)}°C 風${Math.round(this.wind)}km/h ${this.isDay ? '☀昼' : '🌙夜'}`;
  },
};

// ============================================================
// AI 2: AIディレクター — プレイを観測して難易度を動的調整
// ============================================================
const Director = {
  skill: 0.5, spawnMul: 1, shootMul: 1, ebSpeedMul: 1, bellMul: 1,
  timer: 0, msg: null, msgT: 0, trend: 0,

  reset() { this.skill = 0.5; this.spawnMul = 1; this.shootMul = 1; this.ebSpeedMul = 1; this.bellMul = 1; this.timer = 0; this.msg = null; },

  update(dt) {
    if (this.msgT > 0) this.msgT -= dt;
    this.timer += dt;
    if (this.timer < 6) return;
    this.timer = 0;
    const s = game.stats;
    const acc = s.shots > 20 ? s.hits / s.shots : 0.5;
    const now = performance.now();
    const recentDeaths = s.deathTimes.filter(t => now - t < 25000).length;
    const kpm = s.killTimes.filter(t => now - t < 20000).length * 3; // kills/min
    // スキル推定 0..1
    let target = 0.25 + acc * 0.5 + clamp(kpm / 60, 0, 0.35) - recentDeaths * 0.28;
    target = clamp(target, 0, 1);
    const prev = this.skill;
    this.skill = lerp(this.skill, target, 0.5);
    this.trend = this.skill - prev;
    // 調整値へ反映
    this.spawnMul = lerp(1.35, 0.72, this.skill);   // 上手いほど湧きが速い
    this.shootMul = lerp(0.6, 1.45, this.skill);    // 敵の射撃頻度
    this.ebSpeedMul = lerp(0.85, 1.2, this.skill);  // 敵弾速度
    this.bellMul = lerp(1.6, 0.85, this.skill);     // 苦戦時は支援ベル増
    if (Math.abs(this.trend) > 0.09) {
      this.say(this.trend > 0
        ? pick(['🤖 AIディレクター: 好調を検知 → 敵が本気を出す', '🤖 AIディレクター: 腕前上昇 → 難易度アップ'])
        : pick(['🤖 AIディレクター: 苦戦を検知 → 支援ベル増加', '🤖 AIディレクター: 敵の攻勢を緩和中…']));
    }
  },
  say(text) { this.msg = text; this.msgT = 4; },
};

// ============================================================
// AI 3: 学習するボス — プレイヤーの動きを観測して偏差撃ち
// ============================================================
const BossAI = {
  hist: new Array(16).fill(0), sampleT: 0, px: 0, py: 0, vx: 0, vy: 0, thinking: 0,

  reset() { this.hist.fill(0); this.sampleT = 0; this.vx = 0; this.vy = 0; },

  observe(dt) {
    const p = game.player;
    this.sampleT += dt;
    if (this.sampleT >= 0.1) {
      const inv = 1 / this.sampleT;
      this.vx = lerp(this.vx, (p.x - this.px) * inv, 0.35);
      this.vy = lerp(this.vy, (p.y - this.py) * inv, 0.35);
      this.px = p.x; this.py = p.y;
      this.sampleT = 0;
      const b = clamp(Math.floor(latOf(p) / latSpan() * 16), 0, 15);
      this.hist[b] += 1;
    }
    if (this.thinking > 0) this.thinking -= dt;
  },

  // ボスの狙い先: フェーズが進むほど賢くなる
  aimPoint(from, bulletSpeed, phase) {
    const p = game.player;
    if (phase === 0) return { x: p.x, y: p.y };
    // 偏差撃ち: 弾の到達時間ぶん未来を予測
    const t = clamp(dist(from, p) / bulletSpeed, 0, 1.4);
    let ax = p.x + this.vx * t * 0.85;
    let ay = p.y + this.vy * t * 0.85;
    if (phase >= 2 && Math.random() < 0.4) {
      // 「よく居る場所」(ヒストグラム最頻値)を狙う
      let bi = 0;
      for (let i = 1; i < 16; i++) if (this.hist[i] > this.hist[bi]) bi = i;
      const lat = (bi + 0.5) / 16 * latSpan();
      if (isVert()) ax = lerp(ax, lat, 0.6); else ay = lerp(ay, lat, 0.6);
      this.thinking = 0.8;
    }
    return { x: ax, y: ay };
  },
};

// ============================================================
// 入力 (キーボード + タッチ/マウスドラッグ)
// ============================================================
const keys = {};
let dragging = false, lastTouch = null, lastTapT = 0;

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (game.state === 'title' && (e.key === ' ' || e.key === 'Enter')) startRun();
  else if (e.key === ' ' && game.state === 'play') useBomb();
  else if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (game.state === 'play' || game.state === 'pause')) togglePause();
  else if (e.key === 'm' || e.key === 'M') Snd.toggleMute();
  else if (game.state === 'over') {
    if ((e.key === 'c' || e.key === 'C') && game.continues > 0) doContinue();
    else if (e.key === ' ' || e.key === 'Enter') toTitle();
  }
  else if (game.state === 'victory' && (e.key === ' ' || e.key === 'Enter')) toTitle();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('pointerdown', e => {
  Snd.init();
  const now = performance.now();
  if (game.state === 'title') { startRun(); return; }
  if (game.state === 'pause') { togglePause(); return; }
  if (game.state === 'over') { handleOverTap(e.clientX, e.clientY); return; }
  if (game.state === 'victory') { toTitle(); return; }
  if (game.state === 'play') {
    if (now - lastTapT < 280 && lastTouch && Math.hypot(e.clientX - lastTouch.sx, e.clientY - lastTouch.sy) < 40) useBomb();
    lastTapT = now;
  }
  dragging = true;
  lastTouch = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || !lastTouch) return;
  const p = game.player;
  if (game.state === 'play' && !p.dead) {
    p.x = clamp(p.x + (e.clientX - lastTouch.x) * 1.7, 22, W - 22);
    p.y = clamp(p.y + (e.clientY - lastTouch.y) * 1.7, 40, H - 22);
  }
  lastTouch.x = e.clientX; lastTouch.y = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

pauseBtn.addEventListener('click', () => { Snd.init(); togglePause(); });
muteBtn.addEventListener('click', () => { Snd.init(); Snd.toggleMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'play') togglePause();
});

// ============================================================
// ゲーム状態
// ============================================================
function newGame() {
  return {
    state: 'title', // title/intro/play/warn/clear/pause/over/victory
    score: 0,
    hi: parseInt(localStorage.getItem('edu_hiscore') || '0'),
    lives: CFG.MAX_LIVES, bombs: 1, continues: CFG.CONTINUES,
    combo: 0, comboMul: 1, lastKill: 0,
    stageIndex: 0, stageTime: 0, waveIdx: 0,
    nextWave: 0, nextBell: 0,
    bossActive: false, warnT: 0, clearT: 0, introT: 0, overT: 0,
    pausedFrom: 'play',
    player: {
      x: 0, y: 0, power: 1, options: 0, trail: [],
      shield: false, boost: false, boostT: 0,
      fireT: 0, inv: false, invT: 0, dead: false, anim: 0,
    },
    pBullets: [], eBullets: [], enemies: [], bells: [], boss: null,
    particles: [], popups: [], bgFloats: [], stars: [],
    shakeX: 0, shakeY: 0, shake: 0, flash: 0,
    lightT: rand(5, 9), boltAnim: null,
    titleAnim: 0,
    stats: { shots: 0, hits: 0, kills: 0, deathTimes: [], killTimes: [] },
    overBtns: [],
  };
}
let game = newGame();

function initStars() {
  game.stars = [];
  for (let l = 0; l < 3; l++)
    for (let i = 0; i < 36; i++)
      game.stars.push({ x: rand(0, W), y: rand(0, H), l, size: rand(1, 2.6) * (1 + l * 0.3), b: rand(0.3, 1) });
}

// ============================================================
// パーティクル / ポップアップ
// ============================================================
function particles(x, y, n, color, mul = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(30, 160) * mul;
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(0.9, 2.6), size: rand(2, 6), color });
  }
}
function popup(x, y, text, color = '#ffdd44') {
  game.popups.push({ x, y, text, color, life: 1 });
}
function explosion(x, y, size, color) {
  particles(x, y, size * 3, color, 1.5);
  particles(x, y, size, '#ffffff', 0.8);
  game.shake = Math.min(game.shake + size * 0.5, CFG.MAX_SHAKE);
}

// ============================================================
// プレイヤー
// ============================================================
function resetPlayer(keepPower = false) {
  const p = game.player, home = playerHome();
  p.x = home.x; p.y = home.y;
  p.dead = false; p.inv = true; p.invT = CFG.INV_TIME;
  p.fireT = 0; p.trail = [];
  if (!keepPower) { /* パワー維持はステージ間 */ }
}

function updatePlayer(dt) {
  const p = game.player;
  if (p.dead) return;
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
  if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
  const spd = CFG.PLAYER_SPEED * (p.boost ? 1.5 : 1) * dt;
  p.x = clamp(p.x + dx * spd, 22, W - 22);
  p.y = clamp(p.y + dy * spd, 40, H - 22);

  // オプション用の軌跡
  p.trail.unshift({ x: p.x, y: p.y });
  if (p.trail.length > 40) p.trail.pop();

  if (p.inv) { p.invT -= dt * 1000; if (p.invT <= 0) p.inv = false; }
  if (p.boost) { p.boostT -= dt * 1000; if (p.boostT <= 0) p.boost = false; }

  p.fireT -= dt * 1000;
  if (p.fireT <= 0) {
    fire();
    p.fireT = p.power >= 3 ? 105 : 130;
  }
  p.anim += dt * 10;
}

function fire() {
  const p = game.player, a = fwAngle();
  const fx = Math.cos(a), fy = Math.sin(a);
  const px = -fy, py = fx; // 垂直方向
  Snd.shoot();
  const mk = (ox, oy, spread = 0) => {
    game.pBullets.push({
      x: p.x + fx * 20 + px * ox, y: p.y + fy * 20 + py * ox,
      vx: fx * CFG.BULLET_SPEED + px * spread, vy: fy * CFG.BULLET_SPEED + py * spread,
      size: 4,
    });
    game.stats.shots++;
  };
  if (p.power === 1) mk(0, 0);
  else if (p.power === 2) { mk(-9); mk(9); }
  else { mk(0); mk(-13, 0, -45); mk(13, 0, 45); }
  // オプション(分身)も射撃
  for (let i = 0; i < p.options; i++) {
    const t = p.trail[Math.min((i + 1) * 14, p.trail.length - 1)];
    if (t) {
      game.pBullets.push({ x: t.x + fx * 16, y: t.y + fy * 16, vx: fx * CFG.BULLET_SPEED, vy: fy * CFG.BULLET_SPEED, size: 3, opt: true });
      game.stats.shots++;
    }
  }
}

function killPlayer() {
  const p = game.player;
  if (p.dead || p.inv) return;
  if (p.shield) {
    p.shield = false;
    p.inv = true; p.invT = 700;
    particles(p.x, p.y, 16, '#ffd700');
    Snd.hit();
    return;
  }
  Snd.death();
  explosion(p.x, p.y, 9, '#ff6600');
  game.flash = 0.5;
  game.lives--;
  game.stats.deathTimes.push(performance.now());
  p.dead = true;
  p.power = Math.max(1, p.power - 1);
  p.options = Math.max(0, p.options - 1);
  game.combo = 0; game.comboMul = 1;
  if (game.lives <= 0) {
    setTimeout(() => {
      if (game.state !== 'play' && game.state !== 'warn') return;
      game.state = 'over';
      game.overT = 0;
      saveHi();
      Snd.stopBGM();
    }, 900);
  } else {
    setTimeout(() => {
      if (game.state !== 'play' && game.state !== 'warn') return;
      resetPlayer();
    }, 500);
  }
}

function useBomb() {
  if (game.bombs <= 0 || game.player.dead || game.state !== 'play') return;
  game.bombs--;
  Snd.bomb();
  game.flash = 0.8;
  game.shake = CFG.MAX_SHAKE;
  for (const e of game.enemies) {
    if (e.delay > 0) continue;
    e.hp -= 4;
    if (e.hp <= 0) killEnemy(e, true);
  }
  game.enemies = game.enemies.filter(e => e.hp > 0 || e.delay > 0);
  game.eBullets = [];
  if (game.boss && !game.boss.entering) damageBoss(10);
  particles(game.player.x, game.player.y, 40, '#7CFC00', 3);
}

// ============================================================
// 敵
// ============================================================
function spawnWave() {
  const st = stage();
  const list = PATTERNS[game.waveIdx % PATTERNS.length](st.enemies);
  for (const it of list) {
    const t = it.t;
    const lat = clamp(it.lat, 42, latSpan() - 42);
    game.enemies.push({
      type: t.type, emoji: t.emoji,
      hp: t.hp, maxHp: t.hp, speed: t.speed, pts: t.pts, size: t.size,
      amp: t.amp || 60, freq: t.freq || 2, shootRate: t.shootRate || 0,
      prog: 0, lat0: lat, lat, phase: rand(0, Math.PI * 2),
      shootT: rand(600, 1800), delay: it.delay, flash: 0,
      locked: false, lockLat: 0, x: -999, y: -999,
    });
  }
  game.waveIdx++;
}

function updateEnemies(dt) {
  const wMod = Weather.mods, span = fwSpan();
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];
    if (e.delay > 0) { e.delay -= dt * 1000; continue; }
    const spd = e.speed * wMod.enemySpeed * dt;

    switch (e.type) {
      case 'straight':
        e.prog += spd;
        break;
      case 'wave':
        e.prog += spd;
        e.phase += e.freq * dt * Math.PI;
        e.lat = e.lat0 + Math.sin(e.phase) * e.amp;
        break;
      case 'shooter':
      case 'tank':
        e.prog += spd * (e.prog < span * 0.45 ? 1 : 0.25);
        e.shootT -= dt * 1000;
        if (e.shootT <= 0 && e.prog > 60 && e.prog < span * 0.75) {
          e.shootT = 1000 / (e.shootRate * Director.shootMul);
          const a = Math.atan2(game.player.y - e.y, game.player.x - e.x);
          const bs = CFG.EBULLET_SPEED * Director.ebSpeedMul;
          if (e.type === 'tank') {
            for (let k = -1; k <= 1; k++)
              game.eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a + k * 0.25) * bs, vy: Math.sin(a + k * 0.25) * bs, size: 5 });
          } else {
            game.eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * bs, vy: Math.sin(a) * bs, size: 5 });
          }
        }
        break;
      case 'kamikaze':
        if (!e.locked && e.prog > 70) { e.locked = true; e.lockLat = latOf(game.player); }
        e.prog += spd * (e.locked ? 1.5 : 1);
        if (e.locked) e.lat = lerp(e.lat, e.lockLat, dt * 3);
        break;
    }

    const pos = posFromPL(e.prog, e.lat);
    e.x = pos.x; e.y = pos.y;
    if (e.flash > 0) e.flash -= dt * 8;
    if (e.prog > span + 110 || e.lat < -90 || e.lat > latSpan() + 90) game.enemies.splice(i, 1);
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  e.flash = 1;
  game.stats.hits++;
  Snd.hit();
  particles(e.x, e.y, 2, '#ffffff');
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e, silent = false) {
  const now = performance.now();
  if (now - game.lastKill < CFG.COMBO_WINDOW) {
    game.combo++;
    game.comboMul = Math.min(1 + Math.floor(game.combo / 3), CFG.MAX_COMBO_MUL);
  } else { game.combo = 0; game.comboMul = 1; }
  game.lastKill = now;
  game.stats.kills++;
  game.stats.killTimes.push(now);
  if (game.stats.killTimes.length > 200) game.stats.killTimes.shift();
  const pts = Math.round(e.pts * game.comboMul * Weather.mods.scoreMul);
  game.score += pts;
  if (!silent) Snd.kill();
  explosion(e.x, e.y, 5, stage().sky[1]);
  popup(e.x, e.y - 18, '+' + pts, game.comboMul > 1 ? '#ff8844' : '#ffdd44');
}

// ============================================================
// ボス
// ============================================================
function spawnBoss() {
  const st = stage();
  game.boss = {
    prog: -80, targetProg: 150, lat: latSpan() / 2, latPhase: 0,
    hp: st.boss.hp, maxHp: st.boss.hp, phase: 0,
    atkT: 900, atkIdx: 0, flash: 0, entering: true,
    charging: false, chargeTo: null, x: -999, y: -999,
  };
  game.bossActive = true;
  BossAI.reset();
  Snd.startBGM('boss');
}

function updateBoss(dt) {
  const b = game.boss;
  if (!b) return;
  BossAI.observe(dt);

  if (b.entering) {
    b.prog = lerp(b.prog, b.targetProg, dt * 2);
    if (Math.abs(b.prog - b.targetProg) < 3) { b.entering = false; b.prog = b.targetProg; }
  } else {
    if (b.flash > 0) b.flash -= dt * 6;
    const hpR = b.hp / b.maxHp;
    b.phase = hpR <= 0.33 ? 2 : hpR <= 0.66 ? 1 : 0;

    if (b.charging) {
      b.x = lerp(b.x, b.chargeTo.x, dt * 4);
      b.y = lerp(b.y, b.chargeTo.y, dt * 4);
      if (Math.hypot(b.x - b.chargeTo.x, b.y - b.chargeTo.y) < 12) {
        // 突進終了 → 現座標からprog/latを逆算して滑らかに帰投
        b.charging = false;
        const inv = invPL(b.x, b.y);
        b.prog = inv.prog; b.lat = inv.lat;
        b.returning = true;
      }
      if (b.charging) return;
    } else {
      b.latPhase += dt * (1.2 + b.phase * 0.4);
      const oscLat = latSpan() / 2 + Math.sin(b.latPhase) * latSpan() * 0.3;
      if (b.returning) {
        b.prog = lerp(b.prog, b.targetProg, dt * 2.5);
        b.lat = lerp(b.lat, oscLat, dt * 2.5);
        if (Math.abs(b.prog - b.targetProg) < 4) b.returning = false;
      } else {
        b.lat = oscLat;
      }

      b.atkT -= dt * 1000;
      if (b.atkT <= 0 && !b.returning) {
        const ph = BOSS_PHASES[b.phase];
        const atk = ph.attacks[b.atkIdx % ph.attacks.length];
        b.atkT = atk.interval;
        b.atkIdx++;
        bossAttack(b, atk);
      }
    }
  }
  if (!b.charging) {
    const pos = posFromPL(b.prog, b.lat);
    b.x = pos.x; b.y = pos.y;
  }
}

// x,y → prog/lat 逆変換
function invPL(x, y) {
  switch (stage().dir) {
    case 'up':    return { prog: y + 50, lat: x };
    case 'down':  return { prog: H + 50 - y, lat: x };
    case 'right': return { prog: W + 50 - x, lat: y };
    case 'left':  return { prog: x + 50, lat: y };
  }
}

function bossAttack(b, atk) {
  switch (atk.type) {
    case 'aimed': {
      const aim = BossAI.aimPoint(b, atk.speed, b.phase);
      const base = Math.atan2(aim.y - b.y, aim.x - b.x);
      for (let i = 0; i < atk.count; i++) {
        const a = base + (i - (atk.count - 1) / 2) * 0.16;
        game.eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * atk.speed, vy: Math.sin(a) * atk.speed, size: 7, boss: true });
      }
      break;
    }
    case 'spread': {
      const base = inAngle();
      for (let i = 0; i < atk.count; i++) {
        const a = base - atk.arc / 2 + atk.arc / (atk.count - 1) * i;
        game.eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * atk.speed, vy: Math.sin(a) * atk.speed, size: 6, boss: true });
      }
      break;
    }
    case 'summon': {
      const t = stage().enemies[atk.minion];
      for (let i = 0; i < 3; i++) {
        game.enemies.push({
          type: t.type === 'tank' ? 'shooter' : t.type, emoji: t.emoji,
          hp: 1, maxHp: 1, speed: t.speed * 0.85, pts: t.pts, size: t.size,
          amp: t.amp || 60, freq: t.freq || 2, shootRate: t.shootRate || 0,
          prog: b.prog + 20, lat0: b.lat + (i - 1) * 46, lat: b.lat + (i - 1) * 46,
          phase: rand(0, Math.PI * 2), shootT: 1600, delay: i * 180, flash: 0,
          locked: false, lockLat: 0, x: -999, y: -999,
        });
      }
      break;
    }
    case 'charge': {
      b.charging = true;
      const p = game.player, a = fwAngle();
      b.chargeTo = { x: p.x + Math.cos(a) * 60, y: p.y + Math.sin(a) * 60 };
      break;
    }
  }
}

function damageBoss(dmg) {
  const b = game.boss;
  if (!b || b.entering) return;
  b.hp -= dmg;
  b.flash = 1;
  game.stats.hits++;
  Snd.bossHit();
  game.shake = Math.min(game.shake + 1.5, CFG.MAX_SHAKE);
  if (b.hp <= 0) {
    Snd.kill();
    for (let i = 0; i < 5; i++)
      setTimeout(() => { if (game.boss !== null || i === 0) explosion(b.x + rand(-40, 40), b.y + rand(-40, 40), 10, pick(['#ffd700', '#ff6600', '#ff2200'])); }, i * 130);
    explosion(b.x, b.y, 16, '#ffd700');
    game.boss = null;
    game.bossActive = false;
    const bonus = Math.round(5000 * (game.stageIndex + 1) * Weather.mods.scoreMul);
    game.score += bonus;
    popup(W / 2, H / 2 - 60, 'BOSS BONUS +' + bonus, '#ffd700');
    game.eBullets = [];
    saveHi();
    if (game.stageIndex >= STAGES.length - 1) {
      game.state = 'victory';
      Snd.stopBGM();
      Snd.victory();
    } else {
      game.state = 'clear';
      game.clearT = CFG.CLEAR_TIME;
      Snd.stopBGM();
      Snd.clear();
    }
  }
}

// ============================================================
// ベル (パワーアップ)
// ============================================================
function spawnBell() {
  game.bells.push({
    prog: 60, lat: rand(50, latSpan() - 50),
    idx: 0, hits: 0, phase: rand(0, Math.PI * 2), size: 16, x: -999, y: -999,
  });
}

function hitBell(bell) {
  bell.hits++;
  bell.idx = (bell.idx + 1) % BELLS.length;
  bell.prog -= 26; // 撃つと奥に戻る(Twinbee風)
  Snd.bell();
  particles(bell.x, bell.y, 3, BELLS[bell.idx].color);
}

function collectBell(bell) {
  const bt = BELLS[bell.idx];
  const p = game.player;
  Snd.power();
  particles(bell.x, bell.y, 14, bt.color);
  popup(bell.x, bell.y - 16, bt.name + '!', bt.color);
  switch (bt.effect) {
    case 'points': game.score += Math.round(bt.value * game.comboMul * Weather.mods.scoreMul); break;
    case 'speed': p.boost = true; p.boostT = bt.duration; break;
    case 'power': p.power = Math.min(p.power + 1, CFG.MAX_POWER); break;
    case 'option': p.options = Math.min(p.options + 1, CFG.MAX_OPTIONS); break;
    case 'shield': p.shield = true; break;
    case 'bomb': game.bombs = Math.min(game.bombs + 1, CFG.MAX_BOMBS); break;
  }
}

// ============================================================
// ステージ進行
// ============================================================
function startStage(i) {
  game.stageIndex = i;
  game.stageTime = 0;
  game.waveIdx = 0;
  game.bossActive = false;
  game.warnT = 0;
  game.nextWave = 1400;
  game.nextBell = 6500;
  game.enemies = []; game.eBullets = []; game.pBullets = [];
  game.bells = []; game.bgFloats = []; game.popups = [];
  game.boss = null;
  game.state = 'intro';
  game.introT = CFG.INTRO_TIME;
  resetPlayer();
  initStars();
  Snd.stopBGM();
}

function updateStage(dt) {
  game.stageTime += dt * 1000;
  const st = stage();

  if (!game.bossActive && game.warnT <= 0) {
    game.nextWave -= dt * 1000;
    if (game.nextWave <= 0) {
      spawnWave();
      const base = (2900 - game.stageIndex * 260) * Director.spawnMul / Weather.mods.spawnMul;
      game.nextWave = Math.max(1000, base + rand(-400, 400));
    }
    game.nextBell -= dt * 1000;
    if (game.nextBell <= 0) {
      spawnBell();
      const clearBonus = Weather.kind === 'clear' ? 0.8 : 1;
      game.nextBell = rand(9000, 15000) * clearBonus / Director.bellMul;
    }
    // ボス警告
    if (game.stageTime >= st.dur) {
      game.warnT = CFG.WARN_TIME;
      Snd.warning();
      game.enemies = [];
      game.eBullets = [];
      game.bells = [];
    }
  }
  if (game.warnT > 0) {
    game.warnT -= dt * 1000;
    if (game.warnT <= 0) spawnBoss();
  }
}

// ============================================================
// 弾 / ベル / 背景の移動
// ============================================================
function updateBullets(dt) {
  const wind = Weather.mods.windLat;
  const a = fwAngle();
  const px = -Math.sin(a), py = Math.cos(a); // 垂直単位ベクトル

  for (let i = game.pBullets.length - 1; i >= 0; i--) {
    const b = game.pBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -25 || b.x > W + 25 || b.y < -25 || b.y > H + 25) game.pBullets.splice(i, 1);
  }
  for (let i = game.eBullets.length - 1; i >= 0; i--) {
    const b = game.eBullets[i];
    b.x += (b.vx + px * wind * 0.5) * dt;
    b.y += (b.vy + py * wind * 0.5) * dt;
    if (b.x < -25 || b.x > W + 25 || b.y < -25 || b.y > H + 25) game.eBullets.splice(i, 1);
  }
  for (let i = game.bells.length - 1; i >= 0; i--) {
    const bl = game.bells[i];
    bl.prog += 42 * dt;
    bl.phase += dt * 3;
    bl.lat += Math.sin(bl.phase) * 14 * dt + wind * 0.4 * dt;
    const pos = posFromPL(bl.prog, bl.lat);
    bl.x = pos.x; bl.y = pos.y;
    if (bl.prog > fwSpan() + 90) game.bells.splice(i, 1);
  }
}

function updateBg(dt) {
  const st = stage();
  // 星
  const a = inAngle();
  const mx = Math.cos(a), my = Math.sin(a);
  for (const s of game.stars) {
    const spd = 22 + s.l * 32;
    s.x += mx * spd * dt;
    s.y += my * spd * dt;
    if (s.x < -12) s.x = W + 10; if (s.x > W + 12) s.x = -10;
    if (s.y < -12) s.y = H + 10; if (s.y > H + 12) s.y = -10;
  }
  // 背景絵文字
  if (Math.random() < dt * 0.65) {
    game.bgFloats.push({
      emoji: pick(st.bgEmojis),
      prog: -60, lat: rand(20, latSpan() - 20),
      speed: rand(28, 62), size: rand(22, 44) * UI, alpha: rand(0.13, 0.3),
      x: -999, y: -999,
    });
  }
  for (let i = game.bgFloats.length - 1; i >= 0; i--) {
    const f = game.bgFloats[i];
    f.prog += f.speed * dt;
    const pos = posFromPL(f.prog, f.lat);
    f.x = pos.x; f.y = pos.y;
    if (f.prog > fwSpan() + 130) game.bgFloats.splice(i, 1);
  }
}

// 天気: 雷 — 落雷が敵を焼く
function updateLightning(dt) {
  if (!Weather.mods.lightning || game.state !== 'play') return;
  game.lightT -= dt;
  if (game.boltAnim) { game.boltAnim.t -= dt; if (game.boltAnim.t <= 0) game.boltAnim = null; }
  if (game.lightT <= 0) {
    game.lightT = rand(6, 11);
    const targets = game.enemies.filter(e => e.delay <= 0).slice(0, 3);
    if (targets.length) {
      game.flash = Math.max(game.flash, 0.55);
      Snd.zap();
      const pts = [];
      for (const e of targets) {
        pts.push({ x: e.x, y: e.y });
        explosion(e.x, e.y, 5, '#aaddff');
        popup(e.x, e.y - 16, '⚡ +' + e.pts, '#aaddff');
        game.score += e.pts;
      }
      game.enemies = game.enemies.filter(e => !targets.includes(e));
      game.boltAnim = { t: 0.35, pts };
      Director.say('⛈️ 現実の雷雨がゲーム内に落雷! 敵を殲滅');
    }
  }
}

// ============================================================
// 当たり判定
// ============================================================
function checkCollisions() {
  const p = game.player;
  const hitR = 7, collectR = 24;

  // 自弾 vs 敵/ボス/ベル
  for (let bi = game.pBullets.length - 1; bi >= 0; bi--) {
    const b = game.pBullets[bi];
    let used = false;
    for (let ei = game.enemies.length - 1; ei >= 0; ei--) {
      const e = game.enemies[ei];
      if (e.delay > 0) continue;
      if (dist(b, e) < e.size + b.size) {
        damageEnemy(e, 1);
        game.pBullets.splice(bi, 1);
        used = true;
        if (e.hp <= 0) game.enemies.splice(ei, 1);
        break;
      }
    }
    if (used) continue;
    if (game.boss && !game.boss.entering && dist(b, game.boss) < 42 + b.size) {
      damageBoss(1);
      game.pBullets.splice(bi, 1);
      continue;
    }
    for (let li = game.bells.length - 1; li >= 0; li--) {
      const bl = game.bells[li];
      if (dist(b, bl) < bl.size + b.size + 4) {
        hitBell(bl);
        game.pBullets.splice(bi, 1);
        break;
      }
    }
  }

  // ベル回収
  if (!p.dead) {
    for (let i = game.bells.length - 1; i >= 0; i--) {
      if (dist(game.bells[i], p) < collectR + game.bells[i].size) {
        collectBell(game.bells[i]);
        game.bells.splice(i, 1);
      }
    }
  }

  if (p.dead || p.inv) return;

  for (let i = game.eBullets.length - 1; i >= 0; i--) {
    if (dist(game.eBullets[i], p) < hitR + game.eBullets[i].size) {
      game.eBullets.splice(i, 1);
      killPlayer();
      return;
    }
  }
  for (const e of game.enemies) {
    if (e.delay > 0) continue;
    if (dist(e, p) < hitR + e.size * 0.72) { killPlayer(); return; }
  }
  if (game.boss && !game.boss.entering && dist(game.boss, p) < hitR + 38) { killPlayer(); return; }
}

// ============================================================
// 状態遷移
// ============================================================
function startRun() {
  Snd.init();
  const hi = game.hi;
  game = newGame();
  game.hi = hi;
  Director.reset();
  startStage(0);
}

function toTitle() {
  saveHi();
  Snd.stopBGM();
  const hi = Math.max(game.hi, game.score);
  game = newGame();
  game.hi = hi;
  initStars();
}

function doContinue() {
  if (game.continues <= 0) return;
  game.continues--;
  Snd.continueJingle();
  // ステージ最初から再開(スコアは維持)
  startStage(game.stageIndex);
  game.lives = CFG.MAX_LIVES;
  game.bombs = 1;
}

function togglePause() {
  if (game.state === 'play' || game.state === 'warn') {
    game.pausedFrom = game.state;
    game.state = 'pause';
    Snd.stopBGM();
  } else if (game.state === 'pause') {
    game.state = game.pausedFrom;
    Snd.startBGM(game.bossActive ? 'boss' : 'stage');
  }
}

function handleOverTap(x, y) {
  for (const btn of game.overBtns) {
    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      if (btn.id === 'continue') doContinue();
      else toTitle();
      return;
    }
  }
}

function saveHi() {
  if (game.score > game.hi) {
    game.hi = game.score;
    localStorage.setItem('edu_hiscore', String(game.hi));
  }
}

// ============================================================
// 描画
// ============================================================
const FONT = '"Press Start 2P", "Courier New", monospace';
function setFont(size, bold = true) { ctx.font = `${bold ? 'bold ' : ''}${Math.round(size)}px ${FONT}`; }

// 天気パーティクル(雨/雪)
let wDrops = null;
function ensureWeatherDrops() {
  if (wDrops) return;
  wDrops = [];
  for (let i = 0; i < 90; i++) wDrops.push({ x: rand(0, W), y: rand(0, H), s: rand(0.6, 1.4) });
}

function drawBackground() {
  const st = stage();
  const cols = Weather.mods.night ? st.night : st.sky;
  const horiz = !isVert();
  const grad = horiz ? ctx.createLinearGradient(0, 0, W, 0) : ctx.createLinearGradient(0, 0, 0, H);
  const d = stage().dir;
  // 前方(敵が来る側)を明るく
  if (d === 'up' || d === 'left') { grad.addColorStop(0, cols[1]); grad.addColorStop(1, cols[0]); }
  else { grad.addColorStop(0, cols[0]); grad.addColorStop(1, cols[1]); }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 星(夜 or 宇宙系ステージで濃く)
  const starAlpha = Weather.mods.night || game.stageIndex >= 4 ? 1 : 0.4;
  for (const s of game.stars) {
    const tw = 0.5 + 0.5 * Math.sin(performance.now() * 0.003 + s.x);
    ctx.fillStyle = `rgba(255,255,255,${(s.b * tw * starAlpha).toFixed(3)})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // 背景絵文字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of game.bgFloats) {
    ctx.globalAlpha = f.alpha;
    ctx.font = `${Math.round(f.size)}px serif`;
    ctx.fillText(f.emoji, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawWeatherFx() {
  const m = Weather.mods;
  if (m.rain || m.snow) {
    ensureWeatherDrops();
    const wind = m.windLat * 0.6;
    if (m.rain) {
      ctx.strokeStyle = 'rgba(180,220,255,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const dr of wDrops) {
        dr.y += (540 * dr.s) / 60; dr.x += wind / 60;
        if (dr.y > H) { dr.y = -12; dr.x = rand(0, W); }
        if (dr.x > W) dr.x -= W; if (dr.x < 0) dr.x += W;
        ctx.moveTo(dr.x, dr.y);
        ctx.lineTo(dr.x - wind * 0.03, dr.y - 13 * dr.s);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (const dr of wDrops) {
        dr.y += (60 * dr.s) / 60;
        dr.x += Math.sin(dr.y * 0.02 + dr.s * 9) * 0.6 + wind / 90;
        if (dr.y > H) { dr.y = -6; dr.x = rand(0, W); }
        if (dr.x > W) dr.x -= W; if (dr.x < 0) dr.x += W;
        ctx.globalAlpha = 0.4 + 0.4 * dr.s;
        ctx.fillRect(dr.x, dr.y, 2.2 * dr.s, 2.2 * dr.s);
      }
      ctx.globalAlpha = 1;
    }
  }
  // 猛暑/氷点下の色調
  if (Weather.temp !== null) {
    if (Weather.temp >= 32) { ctx.fillStyle = 'rgba(255,60,0,0.06)'; ctx.fillRect(0, 0, W, H); }
    else if (Weather.temp <= 0) { ctx.fillStyle = 'rgba(80,160,255,0.07)'; ctx.fillRect(0, 0, W, H); }
  }
  // 落雷アニメ
  if (game.boltAnim) {
    ctx.strokeStyle = `rgba(200,230,255,${game.boltAnim.t / 0.35})`;
    ctx.lineWidth = 3;
    for (const pt of game.boltAnim.pts) {
      ctx.beginPath();
      let x = pt.x + rand(-30, 30), y = 0;
      ctx.moveTo(x, y);
      while (y < pt.y) { y += rand(20, 50); x += rand(-24, 24); ctx.lineTo(Math.min(x, pt.x + 40), Math.min(y, pt.y)); }
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    }
  }
}

function drawFog() {
  if (!Weather.mods.fog || game.state !== 'play') return;
  const p = game.player;
  const r = Math.min(W, H) * 0.42;
  const g = ctx.createRadialGradient(p.x, p.y, r * 0.45, p.x, p.y, r * 1.5);
  g.addColorStop(0, 'rgba(20,20,30,0)');
  g.addColorStop(1, 'rgba(20,20,30,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawPlayer() {
  const p = game.player;
  if (p.dead) return;
  if (p.inv && Math.floor(p.invT / 80) % 2 === 0) return;

  // オプション(分身)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < p.options; i++) {
    const t = p.trail[Math.min((i + 1) * 14, p.trail.length - 1)];
    if (!t) continue;
    const pulse = 5 + Math.sin(performance.now() * 0.008 + i * 2) * 1.5;
    ctx.fillStyle = 'rgba(185,103,255,0.35)';
    ctx.beginPath(); ctx.arc(t.x, t.y, pulse + 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e3c8ff';
    ctx.beginPath(); ctx.arc(t.x, t.y, pulse, 0, Math.PI * 2); ctx.fill();
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(fwAngle() + Math.PI / 2); // 機体は上向き基準

  // スラスター
  const th = 9 + Math.sin(p.anim) * 4;
  const tg = ctx.createLinearGradient(0, 13, 0, 13 + th);
  tg.addColorStop(0, '#fff'); tg.addColorStop(0.4, '#ffd400'); tg.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(-5, 13); ctx.lineTo(5, 13); ctx.lineTo(1, 13 + th); ctx.lineTo(-1, 13 + th);
  ctx.fill();

  // 機体 (ピクセル風)
  ctx.fillStyle = '#4488ff'; ctx.fillRect(-6, -4, 12, 18);
  ctx.fillStyle = '#66aaff'; ctx.fillRect(-4, -2, 8, 14);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, -15, 6, 13);
  ctx.fillStyle = '#ccddff'; ctx.fillRect(-2, -13, 4, 11);
  ctx.fillStyle = '#ff4444'; ctx.fillRect(-17, 4, 11, 8); ctx.fillRect(6, 4, 11, 8);
  ctx.fillStyle = '#ff7777'; ctx.fillRect(-15, 6, 7, 4); ctx.fillRect(8, 6, 7, 4);
  ctx.fillStyle = '#00ffaa'; ctx.fillRect(-2, -8, 4, 6);

  if (p.shield) {
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.55 + 0.3 * Math.sin(performance.now() * 0.006);
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (p.boost) {
    ctx.fillStyle = 'rgba(74,158,255,0.22)';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBullets() {
  const a = fwAngle();
  for (const b of game.pBullets) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = b.opt ? 'rgba(185,103,255,0.45)' : 'rgba(120,210,255,0.4)';
    ctx.fillRect(-2, 0, 4, 11);
    ctx.fillStyle = b.opt ? '#e3c8ff' : '#ffffff';
    ctx.fillRect(-2, -5, 4, 9);
    ctx.restore();
  }
  for (const b of game.eBullets) {
    const s = b.size;
    ctx.fillStyle = b.boss ? 'rgba(255,80,80,0.3)' : 'rgba(255,190,80,0.3)';
    ctx.beginPath(); ctx.arc(b.x, b.y, s + 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = b.boss ? '#ff4646' : '#ffaa00';
    ctx.beginPath(); ctx.arc(b.x, b.y, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, s * 0.42, 0, Math.PI * 2); ctx.fill();
  }
}

function drawEnemies() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const e of game.enemies) {
    if (e.delay > 0) continue;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.font = `${e.size * 2}px serif`;
    ctx.fillText(e.emoji, 0, 0);
    if (e.flash > 0) {
      ctx.globalAlpha = clamp(e.flash, 0, 1);
      ctx.fillText('✨', 0, 0);
      ctx.globalAlpha = 1;
    }
    if (e.maxHp > 2) {
      const bw = e.size * 1.6;
      ctx.fillStyle = '#222';
      ctx.fillRect(-bw / 2, -e.size - 8, bw, 3.5);
      ctx.fillStyle = '#ff4646';
      ctx.fillRect(-bw / 2, -e.size - 8, bw * (e.hp / e.maxHp), 3.5);
    }
    ctx.restore();
  }
}

function drawBoss() {
  const b = game.boss;
  if (!b) return;
  ctx.save();
  ctx.translate(b.x, b.y);
  const pulse = 1 + Math.sin(performance.now() * 0.004) * 0.06;
  ctx.scale(pulse, pulse);
  // フェーズオーラ
  const aura = ['rgba(255,255,255,0.2)', 'rgba(255,170,0,0.28)', 'rgba(255,30,30,0.35)'][b.phase];
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '68px serif';
  ctx.fillText(stage().boss.emoji, 0, 0);
  if (b.flash > 0) {
    ctx.globalAlpha = clamp(b.flash * 0.7, 0, 1);
    ctx.font = '74px serif';
    ctx.fillText('💥', 0, 0);
    ctx.globalAlpha = 1;
  }
  // 学習AI思考中マーク
  if (BossAI.thinking > 0) {
    ctx.font = '22px serif';
    ctx.fillText('🧠', 40, -42);
  }
  ctx.restore();

  // ボスHPバー
  if (!b.entering) {
    const bw = Math.min(W * 0.72, 420), bx = (W - bw) / 2, by = 46 + 8 * UI;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 3, by - 3, bw + 6, 14);
    ctx.fillStyle = '#3a0a0a';
    ctx.fillRect(bx, by, bw, 8);
    const r = clamp(b.hp / b.maxHp, 0, 1);
    ctx.fillStyle = r > 0.66 ? '#ff5050' : r > 0.33 ? '#ff9430' : '#ffe14d';
    ctx.fillRect(bx, by, bw * r, 8);
    setFont(9 * UI);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(`${stage().boss.emoji} ${stage().boss.name}`, W / 2, by - 10);
  }
}

function drawBells() {
  ctx.textBaseline = 'middle';
  for (const bl of game.bells) {
    const bt = BELLS[bl.idx];
    ctx.save();
    ctx.translate(bl.x, bl.y + Math.sin(bl.phase) * 3);
    ctx.fillStyle = bt.color + '55';
    ctx.beginPath(); ctx.arc(0, 0, bl.size + 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${bl.size * 2}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🔔', 0, 0);
    ctx.strokeStyle = bt.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, bl.size + 3, 0, Math.PI * 2); ctx.stroke();
    setFont(8 * UI);
    ctx.fillStyle = bt.color;
    ctx.fillText(bt.name, 0, bl.size + 15);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.size * p.life), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  setFont(11 * UI);
  ctx.textAlign = 'center';
  for (const s of game.popups) {
    ctx.globalAlpha = clamp(s.life, 0, 1);
    ctx.fillStyle = s.color;
    ctx.fillText(s.text, s.x, s.y - (1 - s.life) * 46);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const pad = 10, top = 12 + (window.visualViewport ? 0 : 0);
  ctx.textBaseline = 'top';
  // スコア
  setFont(13 * UI);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#000a'; ctx.fillText(String(game.score).padStart(7, '0'), pad + 1, top + 1);
  ctx.fillStyle = '#fff'; ctx.fillText(String(game.score).padStart(7, '0'), pad, top);
  setFont(8 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('HI ' + String(game.hi).padStart(7, '0'), pad, top + 18 * UI);

  // コンボ
  if (game.comboMul > 1 && performance.now() - game.lastKill < CFG.COMBO_WINDOW) {
    setFont(15 * UI);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff8844';
    ctx.fillText(`COMBO x${game.comboMul}`, W / 2, top + 26 * UI);
  }

  // 下段: 残機・ボム・パワー
  ctx.textAlign = 'left';
  ctx.font = `${Math.round(15 * UI)}px serif`;
  let line = '❤️'.repeat(Math.max(0, game.lives)) + ' ' + '💣'.repeat(game.bombs);
  ctx.fillText(line, pad, H - 46 * UI);
  setFont(8 * UI);
  ctx.fillStyle = '#8fd3ff';
  const p = game.player;
  ctx.fillText(`PW${p.power}${p.options ? ' OP' + p.options : ''}${p.shield ? ' 🛡' : ''}${p.boost ? ' 💨' : ''}`, pad, H - 24 * UI);

  // 右下: ステージ + 天気
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fffc';
  setFont(8 * UI);
  ctx.fillText(`STAGE ${game.stageIndex + 1} ${stage().emoji} ${dirDef().arrow}`, W - pad, H - 46 * UI);
  if (Weather.loaded) {
    const icons = { clear: '☀️', clouds: '⛅', fog: '🌫️', rain: '🌧️', snow: '❄️', thunder: '⛈️' };
    ctx.fillText(`${icons[Weather.kind]} ${Math.round(Weather.temp)}°C`, W - pad, H - 24 * UI);
  }

  // AIディレクターメッセージ
  if (Director.msg && Director.msgT > 0) {
    ctx.globalAlpha = clamp(Director.msgT, 0, 1);
    setFont(9 * UI);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(Director.msg, W / 2, H - 70 * UI);
    ctx.globalAlpha = 1;
  }

  // ボス警告
  if (game.warnT > 0) {
    const blink = Math.floor(game.warnT / 220) % 2 === 0;
    if (blink) {
      ctx.fillStyle = 'rgba(255,0,0,0.16)';
      ctx.fillRect(0, H / 2 - 60, W, 120);
      setFont(30 * UI);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ff3030';
      ctx.fillText('⚠ WARNING ⚠', W / 2, H / 2 - 14);
      setFont(11 * UI);
      ctx.fillStyle = '#ffb0b0';
      ctx.fillText(`${stage().boss.name} 接近中`, W / 2, H / 2 + 22);
      ctx.textBaseline = 'top';
    }
  }

  // 操作ヒント(開始数秒)
  if (game.stageIndex === 0 && game.stageTime < 5200 && game.state === 'play') {
    ctx.globalAlpha = clamp((5200 - game.stageTime) / 1000, 0, 0.85);
    setFont(9 * UI);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText('ドラッグ / WASD で移動 (ショットは自動)', W / 2, H - 110 * UI);
    ctx.fillText('ダブルタップ / SPACE でボム💣', W / 2, H - 94 * UI);
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// 各画面
// ============================================================
function drawTitle(dt) {
  game.titleAnim += dt;
  const t = game.titleAnim;
  // 背景: ステージ1の空 + 星
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a2a'); grad.addColorStop(1, '#20124d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  for (const s of game.stars) {
    ctx.fillStyle = `rgba(255,255,255,${s.b * (0.5 + 0.5 * Math.sin(t * 2 + s.x))})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cy = H * 0.30;

  // 弾む絵文字たち
  const emojis = ['🚀', '🐦', '🐙', '👾', '🐉', '🛸'];
  ctx.font = `${Math.round(30 * UI)}px serif`;
  emojis.forEach((e, i) => {
    const x = W / 2 + (i - 2.5) * 46 * UI;
    const y = cy - 74 * UI + Math.sin(t * 3 + i * 1.1) * 10;
    ctx.fillText(e, x, y);
  });

  setFont(34 * UI);
  ctx.fillStyle = '#000'; ctx.fillText('EMOJI DROP', W / 2 + 3, cy + 3);
  const hue = (t * 40) % 360;
  ctx.fillStyle = `hsl(${hue},90%,65%)`;
  ctx.fillText('EMOJI DROP', W / 2, cy);
  setFont(16 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('— U L T I M A T E —', W / 2, cy + 36 * UI);

  // 天気パネル (AI World Engine)
  const py0 = H * 0.48;
  setFont(9 * UI);
  ctx.fillStyle = '#00ffcc';
  ctx.fillText('🤖 AI WORLD ENGINE', W / 2, py0);
  setFont(9 * UI);
  ctx.fillStyle = '#cfe8ff';
  ctx.fillText(Weather.statusLine(), W / 2, py0 + 18 * UI);
  if (Weather.loaded) {
    Weather.effects.slice(0, 3).forEach((fx, i) => {
      ctx.fillStyle = '#9fd8b0';
      ctx.fillText(fx, W / 2, py0 + (36 + i * 15) * UI);
    });
  }

  // スタート
  if (Math.floor(t * 2) % 2 === 0) {
    setFont(13 * UI);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('タップ / SPACE でスタート', W / 2, H * 0.72);
  }
  setFont(9 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('HI-SCORE ' + String(game.hi).padStart(7, '0'), W / 2, H * 0.78);
  ctx.fillStyle = '#8899bb';
  ctx.fillText('ステージ毎に進行方向が変わる ⬆➡⬇⬅', W / 2, H * 0.84);
  ctx.fillText('ベル🔔を撃って色を変えろ!', W / 2, H * 0.875);
}

function drawIntro() {
  const st = stage(), d = dirDef();
  const t = 1 - game.introT / CFG.INTRO_TIME; // 0→1
  drawBackground();
  ctx.fillStyle = 'rgba(0,0,10,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const slide = t < 0.2 ? (0.2 - t) * 5 * 60 : 0;
  setFont(12 * UI);
  ctx.fillStyle = '#8fd3ff';
  ctx.fillText(`STAGE ${game.stageIndex + 1}`, W / 2, H * 0.32 - slide);
  ctx.font = `${Math.round(56 * UI)}px serif`;
  ctx.fillText(st.emoji, W / 2, H * 0.42 - slide);
  setFont(20 * UI);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(st.name, W / 2, H * 0.52 - slide);
  setFont(10 * UI);
  ctx.fillStyle = '#aab';
  ctx.fillText(st.en, W / 2, H * 0.56 - slide);

  // 方向指示(脈動)
  const pulse = 1 + Math.sin(performance.now() * 0.008) * 0.18;
  ctx.save();
  ctx.translate(W / 2, H * 0.68);
  ctx.scale(pulse, pulse);
  ctx.font = `${Math.round(46 * UI)}px serif`;
  ctx.fillText(d.arrow, 0, 0);
  ctx.restore();
  setFont(12 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText(d.ja, W / 2, H * 0.76);
}

function drawClear() {
  drawBackground();
  drawParticles();
  ctx.fillStyle = 'rgba(0,0,10,0.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(24 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('STAGE CLEAR!', W / 2, H * 0.4);
  setFont(12 * UI);
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + game.score, W / 2, H * 0.5);
  const next = STAGES[game.stageIndex + 1];
  if (next) {
    setFont(10 * UI);
    ctx.fillStyle = '#8fd3ff';
    ctx.fillText(`NEXT: ${next.emoji} ${next.name} ${DIRS[next.dir].arrow}`, W / 2, H * 0.58);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(28 * UI);
  ctx.fillStyle = '#ff3030';
  ctx.fillText('GAME OVER', W / 2, H * 0.3);
  setFont(12 * UI);
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + game.score, W / 2, H * 0.4);
  if (game.score >= game.hi && game.score > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.fillText('★ NEW RECORD! ★', W / 2, H * 0.45);
  }

  game.overBtns = [];
  const bw = Math.min(W * 0.7, 300), bh = 46 * UI;
  let by = H * 0.55;
  if (game.continues > 0) {
    drawButton(W / 2 - bw / 2, by, bw, bh, `CONTINUE (残り${game.continues}) [C]`, '#00cc88', 'continue');
    by += bh + 16;
  }
  drawButton(W / 2 - bw / 2, by, bw, bh, 'タイトルへ [SPACE]', '#5577aa', 'title');
}

function drawButton(x, y, w, h, label, color, id) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  setFont(10 * UI);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(label, x + w / 2, y + h / 2);
  game.overBtns.push({ x, y, w, h, id });
}

function drawVictory(dt) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a2a'); grad.addColorStop(1, '#3d1d6b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // 祝賀パーティクル
  if (Math.random() < 0.35) particles(rand(0, W), rand(0, H * 0.5), 5, pick(['#ffd700', '#ff66aa', '#66ffcc', '#8fd3ff']));
  updateParticles(dt);
  drawParticles();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(52 * UI)}px serif`;
  ctx.fillText('🏆', W / 2, H * 0.24);
  setFont(24 * UI);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('ALL STAGES CLEAR!', W / 2, H * 0.35);
  setFont(13 * UI);
  ctx.fillStyle = '#fff';
  ctx.fillText('FINAL SCORE ' + game.score, W / 2, H * 0.45);
  const rank = game.score >= 180000 ? 'S' : game.score >= 120000 ? 'A' : game.score >= 70000 ? 'B' : 'C';
  setFont(38 * UI);
  ctx.fillStyle = { S: '#ffd700', A: '#ff66aa', B: '#8fd3ff', C: '#99cc99' }[rank];
  ctx.fillText('RANK ' + rank, W / 2, H * 0.55);
  const acc = game.stats.shots ? Math.round(game.stats.hits / game.stats.shots * 100) : 0;
  setFont(9 * UI);
  ctx.fillStyle = '#aab';
  ctx.fillText(`撃破 ${game.stats.kills}  命中率 ${acc}%  被弾 ${game.stats.deathTimes.length}`, W / 2, H * 0.62);
  if (Math.floor(performance.now() / 500) % 2 === 0) {
    setFont(11 * UI);
    ctx.fillStyle = '#fff';
    ctx.fillText('タップでタイトルへ', W / 2, H * 0.74);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(22 * UI);
  ctx.fillStyle = '#fff';
  ctx.fillText('PAUSE', W / 2, H * 0.45);
  setFont(10 * UI);
  ctx.fillStyle = '#8fd3ff';
  ctx.fillText('タップ / P で再開', W / 2, H * 0.53);
}

// ============================================================
// 汎用アップデート
// ============================================================
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay * dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}
function updatePopups(dt) {
  for (let i = game.popups.length - 1; i >= 0; i--) {
    game.popups[i].life -= dt * 1.1;
    if (game.popups[i].life <= 0) game.popups.splice(i, 1);
  }
}
function updateShake(dt) {
  if (game.shake > 0.1) {
    game.shakeX = (Math.random() - 0.5) * game.shake * 2;
    game.shakeY = (Math.random() - 0.5) * game.shake * 2;
    game.shake *= Math.pow(0.0015, dt); // 減衰
  } else { game.shakeX = 0; game.shakeY = 0; game.shake = 0; }
  if (game.flash > 0) game.flash -= dt * 2;
}

// ============================================================
// メインループ
// ============================================================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.034);
  lastT = now;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  switch (game.state) {
    case 'title':
      drawTitle(dt);
      break;

    case 'intro':
      game.introT -= dt * 1000;
      updateBg(dt);
      drawIntro();
      if (game.introT <= 0) {
        game.state = 'play';
        Snd.startBGM('stage');
      }
      break;

    case 'play': {
      updateStage(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateBoss(dt);
      updateBullets(dt);
      updateBg(dt);
      updateParticles(dt);
      updatePopups(dt);
      updateShake(dt);
      updateLightning(dt);
      Director.update(dt);
      checkCollisions();

      ctx.save();
      ctx.translate(game.shakeX, game.shakeY);
      drawBackground();
      drawWeatherFx();
      drawBells();
      drawEnemies();
      drawBoss();
      drawBullets();
      drawPlayer();
      drawParticles();
      drawFog();
      drawPopups();
      ctx.restore();
      drawHUD();
      if (game.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${clamp(game.flash, 0, 0.85)})`;
        ctx.fillRect(0, 0, W, H);
      }
      break;
    }

    case 'clear':
      game.clearT -= dt * 1000;
      updateParticles(dt);
      updateBg(dt);
      drawClear();
      if (game.clearT <= 0) startStage(game.stageIndex + 1);
      break;

    case 'pause':
      ctx.save();
      drawBackground();
      drawBells(); drawEnemies(); drawBoss(); drawBullets(); drawPlayer();
      ctx.restore();
      drawHUD();
      drawPause();
      break;

    case 'over':
      game.overT += dt;
      updateParticles(dt);
      drawBackground();
      drawParticles();
      drawGameOver();
      break;

    case 'victory':
      drawVictory(dt);
      break;
  }

  requestAnimationFrame(loop);
}

// ============================================================
// 起動
// ============================================================
initStars();
Weather.load();
pauseBtn.style.display = 'block';
muteBtn.style.display = 'block';
requestAnimationFrame(loop);
</script>
